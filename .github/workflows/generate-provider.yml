# Stage two of the tfpfgen chain: fires when `tfpfgen | Generate` succeeds,
# checks out the generation branch that run pushed, and -- if the curated
# provider block exists -- runs bindings check and provider generate, then
# appends the generated provider to the same branch, so one pull request
# carries the whole chain. Without the provider block it notes the drafts are
# awaiting curation and stops cleanly.
name: tfpfgen | Generate Provider

on:
  workflow_run:
    workflows: ["tfpfgen | Generate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tfpfgen_ref:
        description: 'tfpfgen version to install (a tag, branch or commit).'
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tfpfgen-generate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provider:
    name: '🏗️ Generate the provider'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve the provider name and generation branch
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          NAME="${REPO_NAME#terraform-provider-}"
          {
            echo "PROVIDER_NAME=${NAME}"
            echo "BLUEPRINT_DIR=blueprints/${NAME}"
            echo "GEN_BRANCH=tfpfgen/generate-${NAME}"
          } >> "$GITHUB_ENV"

      - name: Check Out the generation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move to the generation branch when it exists
        run: |
          if git ls-remote --exit-code origin "refs/heads/${GEN_BRANCH}" >/dev/null; then
            git checkout "${GEN_BRANCH}"
            echo "working on ${GEN_BRANCH}"
          else
            echo "no ${GEN_BRANCH} branch; working on ${GITHUB_REF_NAME}"
          fi

      - name: Stop when the provider block is not yet curated
        id: gate
        run: |
          if [ -f "${BLUEPRINT_DIR}/provider.blueprint.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "no provider block yet -- the drafted blueprints in ${BLUEPRINT_DIR} await curation"
            echo "author ${BLUEPRINT_DIR}/provider.blueprint.json (name, goModule, sdk) to unlock this stage"
          fi

      - name: Set up Go
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        if: steps.gate.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: '1.12.1'
          terraform_wrapper: false

      - name: Install tfpfgen
        if: steps.gate.outputs.ready == 'true'
        env:
          REF: ${{ inputs.tfpfgen_ref || 'main' }}
        run: |
          go install "github.com/deploymenttheory/terraform-plugin-framework-codegen/cmd/tfpfgen@${REF}"
          tfpfgen version

      - name: Generate the provider
        if: steps.gate.outputs.ready == 'true'
        run: |
          go mod download all
          tfpfgen bindings check -blueprint "${BLUEPRINT_DIR}" -module .
          # The postcheck builds the tree; generation can introduce imports
          # go.mod does not yet require, so tidy against the written files and
          # regenerate -- the second run proves the tree builds clean.
          if ! tfpfgen provider generate -blueprint "${BLUEPRINT_DIR}" -out .; then
            echo "postcheck refused; tidying the module against the generated tree and retrying"
            go mod tidy
            tfpfgen provider generate -blueprint "${BLUEPRINT_DIR}" -out .
          fi
          go mod tidy
          go build ./...
          go test ./...

      - name: Append the provider to the generation branch
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ the provider already matches the curated blueprints; nothing to append"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate the ${PROVIDER_NAME} provider from the curated blueprints" \
            -m "Stage two of the tfpfgen chain (run ${GITHUB_RUN_ID}): bindings checked against the committed SDK, provider generated in place, module tidied, build and tests run."
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin "HEAD:${BRANCH}"
          if [ "${BRANCH}" = "${GEN_BRANCH}" ]; then
            gh pr create --base "${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH:-main}" --head "${BRANCH}" \
              --title "tfpfgen: generate the ${PROVIDER_NAME} provider" \
              --body "Stage two of the chain appended the generated provider to the generation branch." \
              || echo "the open pull request for ${BRANCH} now carries the provider commit"
          fi
